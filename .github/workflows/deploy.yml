# Builds the dashboard and publishes it to GitHub Pages.
#
# It runs automatically on every push to the default branch, and can also be
# started by hand from the repository's Actions tab ("Run workflow").
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions". Note that GitHub Pages needs the repository to
# be public, unless the account is on a paid GitHub plan.

name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/determined-dijkstra-tklahd, main]
  workflow_dispatch:

# Lets the workflow publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the newer one finish and win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The scoring and parser tests. A failure here stops the deploy, so a
      # broken build never reaches the live site.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
